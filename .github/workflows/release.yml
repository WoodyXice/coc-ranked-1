name: Windows release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable Git tag, for example v1.2.0
        required: true
        type: string

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Verify release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid stable release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', steps.version.outputs.tag) }}
          persist-credentials: false
      - name: Verify package version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -cne $env:RELEASE_VERSION) {
            throw "Tag version $env:RELEASE_VERSION does not match package.json version $version"
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - name: Verify Windows release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $files = @(
            "release/COC-Ranked-Setup-${version}-x64.exe"
            "release/COC-Ranked-Setup-${version}-x64.exe.blockmap"
            "release/COC-Ranked-Portable-${version}-x64.exe"
            'release/latest.yml'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release asset: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Empty release asset: $file"
            }
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release-${{ steps.version.outputs.version }}
          compression-level: 0
          if-no-files-found: error
          path: |
            release/COC-Ranked-Setup-${{ steps.version.outputs.version }}-x64.exe
            release/COC-Ranked-Setup-${{ steps.version.outputs.version }}-x64.exe.blockmap
            release/COC-Ranked-Portable-${{ steps.version.outputs.version }}-x64.exe
            release/latest.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: windows-release-${{ needs.build.outputs.version }}
          path: release
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "release/COC-Ranked-Setup-${RELEASE_VERSION}-x64.exe" \
            "release/COC-Ranked-Setup-${RELEASE_VERSION}-x64.exe.blockmap" \
            "release/COC-Ranked-Portable-${RELEASE_VERSION}-x64.exe" \
            release/latest.yml
